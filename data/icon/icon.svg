<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shared Rainbow Gradient Stops (horizontal flow for bars) -->
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9A62"/>
      <stop offset="20%" stop-color="#FCD34D"/>
      <stop offset="45%" stop-color="#4ADE80"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="88%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Matching Vertical Rainbow Gradient for Bracket (same color stops, vertical flow) -->
    <linearGradient id="rainbowVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9A62"/>
      <stop offset="20%" stop-color="#FCD34D"/>
      <stop offset="45%" stop-color="#4ADE80"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="88%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Radial Background: white center → dark navy-purple edges (spotlight effect) -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F7FF"/>
      <stop offset="80%" stop-color="#DDE4FF"/>
      <stop offset="100%" stop-color="#EADBFF"/>
    </radialGradient>

    <!-- Inner Deboss / Inset Groove Filter for Code Elements -->
    <filter id="deboss" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="1.5"/>
      <feGaussianBlur stdDeviation="1.2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.12" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- macOS Icon Soft Drop Shadow -->
    <filter id="appIconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C3AED" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Subtle inner top highlight (glass-like specular) -->
    <linearGradient id="highlightOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Light border gradient for squircle rim (visible on dark edges) -->
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!--
    macOS App Icon Standard:
      - Canvas: 512x512
      - Squircle: x=44, y=44, width=424, height=424
      - Corner radius: 94 (≈ 22% of width, within 20%-25% spec)
      - Background: radial white center → dark navy-purple edges
      - Center: (256, 256) — code elements centered on white area
  -->

  <!-- Squircle Body with Shadow -->
  <g filter="url(#appIconShadow)">
    <!-- Radial Gradient Background (white center, dark edges) -->
    <rect x="44" y="44" width="424" height="424" rx="94" ry="94" fill="url(#bgGradient)"/>

    <!-- Subtle Glass Specular Highlight -->
    <rect x="44" y="44" width="424" height="424" rx="94" ry="94" fill="url(#highlightOverlay)"/>

    <!-- Rounded Rectangle Border (rim) -->
    <rect x="44" y="44" width="424" height="424" rx="94" ry="94"
          fill="none" stroke="#b978eaff" stroke-width="10"/>
  </g>

  <!--
    Code Elements Layout:
      - Bars: y ∈ [156, 356] (height 200, center y=256)
      - Bracket: y ∈ [136, 376] (extends 20px above/below bars for wrapping feel)
      - Middle bump of bracket: y=256 (aligns with bars' center)
      - All elements horizontally centered within squircle (center x=256)
  -->
  <g filter="url(#deboss)">
    <!-- Left Curly Bracket '{' -->
    <path d="M 158 136
             C 132 136, 122 154, 122 180
             L 122 234
             C 122 246, 112 256, 100 256
             C 112 256, 122 266, 122 278
             L 122 332
             C 122 358, 132 376, 158 376"
          fill="none"
          stroke="url(#rainbowVert)"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 5 Horizontal Code Lines (tree-style nested hierarchy) -->
    <!-- Line 1: Root Tag / Opening (Level 0) -->
    <rect x="229" y="156" width="182" height="20" rx="10" fill="url(#rainbowGradient)"/>
    <!-- Line 2: Child Tag (Level 1) -->
    <rect x="259" y="201" width="140" height="20" rx="10" fill="url(#rainbowGradient)"/>
    <!-- Line 3: Nested Content / Grandchild (Level 2) -->
    <rect x="289" y="246" width="100" height="20" rx="10" fill="url(#rainbowGradient)"/>
    <!-- Line 4: Sibling Tag (Level 1) -->
    <rect x="259" y="291" width="140" height="20" rx="10" fill="url(#rainbowGradient)"/>
    <!-- Line 5: Closing Tag (Level 0) -->
    <rect x="229" y="336" width="182" height="20" rx="10" fill="url(#rainbowGradient)"/>
  </g>
</svg>
