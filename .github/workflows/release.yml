name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            artifact: "*.7z"
          - os: ubuntu-22.04
            platform: linux
            artifact: "*.tar.gz"
          - os: windows-latest
            platform: windows
            artifact: "*.zip"

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            librsvg2-bin

      - name: Install 7z (macOS)
        if: matrix.platform == 'darwin'
        run: brew install p7zip

      - name: Install 7z (Windows)
        if: matrix.platform == 'windows'
        run: choco install 7zip -y

      - name: Verify toolchain
        shell: bash
        run: go version

      - name: Build & Package
        shell: bash
        run: |
          chmod +x ./scripts/run_tools.sh ./scripts/install-bin.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        shell: bash
        run: ls -lh release/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Formatter ${{ github.ref_name }}
          body: |
            ## Formatter ${{ github.ref_name }}

            Auto-built desktop app for all platforms:
            - **macOS**: .app bundle + 7z archive (桌面应用 + CLI)
            - **Linux**: tar.gz archive (桌面应用 + CLI，含 install.sh 安装脚本)
            - **Windows**: zip archive (桌面应用 + CLI)

            ### 使用方式
            - **macOS**: 解压 7z，双击 Formatter.app 启动桌面应用
            - **Linux**: 解压 tar.gz，运行 `install.sh` 安装或直接执行 `Formatter/bin/formatter`
            - **Windows**: 解压 zip，运行 Formatter.exe 启动桌面应用
          files: release/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
